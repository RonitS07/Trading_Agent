<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradePilot - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <style>
        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 10%, #1e293b 0%, #020617 60%);
        }
        
        .login-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            padding: 3rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        .logo-box {
            width: 60px;
            height: 60px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: white;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }

        .brand-name {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            display: block;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2);
            background: rgba(30, 41, 59, 0.8);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            color: white;
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.3);
        }

        footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #64748b;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 1rem;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-box">
            <i class="fa-solid fa-bolt"></i>
        </div>
        <span class="brand-name">TRADE<span style="color: var(--accent-cyan);">PILOT</span></span>
        <div class="brand-subtitle">Next-Gen Trading Terminal</div>

        <form id="login-form">
            <div class="input-group">
                <label>Access ID</label>
                <input type="text" id="access-id" placeholder="Enter ID (e.g. USER01)" required>
            </div>
            <div class="input-group">
                <label>Security PIN</label>
                <input type="password" id="pin" placeholder="••••" maxlength="4" required>
            </div>
            <button type="submit" class="btn-login">INITIALIZE TERMINAL</button>
        </form>
        <div id="error-msg" class="error-msg"></div>

        <footer>
            TradePilot &copy; 2026<br>Restricted Access System
        </footer>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('access-id').value.trim();
            const pin = document.getElementById('pin').value;
            const err = document.getElementById('error-msg');

            // Simulated Auth Strategy
            // Accept any ID, but enforce 4-digit PIN for "Security" theater
            if (id.length > 2 && pin.length === 4) {
                // Determine destination based on device
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                
                // Persist Session
                localStorage.setItem('tp_session', JSON.stringify({
                    id: id,
                    token: 'tp_' + Date.now() + Math.random().toString(36).substr(2),
                    loginTime: Date.now()
                }));

                err.style.color = '#22c55e';
                err.innerText = 'Authenticated. Redirecting...';
                err.style.opacity = '1';

                setTimeout(() => {
                    window.location.href = isMobile ? 'mobile.html' : 'index.html';
                }, 800);
            } else {
                err.innerText = 'Invalid Access Credentials';
                err.style.opacity = '1';
                document.getElementById('login-card').classList.add('shake');
            }
        });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
